# Every change to a skill on main publishes a new release with fresh zips, so
# https://github.com/ptiza-v-nebe/scc-skills/releases/latest/download/<file>.zip
# always serves the current version. The notes list which skills were bumped
# and the version of every skill in the release.
name: release

on:
  push:
    branches: [main]
    paths: ["skills/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check skill versions
        env:
          # empty on workflow_dispatch, all zeros on a branch's first push:
          # then only the per-file checks run
          BEFORE: ${{ github.event.before }}
        run: scripts/check-versions.sh "${BEFORE:-HEAD}" | tee changed.txt
      - run: scripts/build-zips.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          {
            echo "## Changed"
            if [ -s changed.txt ]; then sed 's/^/- /' changed.txt; else echo "- none"; fi
            echo
            echo "## All skills"
            for f in skills/*/SKILL.md; do
              v=$(awk -F: '/^  version:/ { gsub(/[" ]/, "", $2); print $2; exit }' "$f")
              echo "- $(basename "$(dirname "$f")") v$v"
            done
          } >notes.md
          gh release create "$tag" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md
